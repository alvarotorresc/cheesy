[build]
  command = "pnpm build"
  publish = "dist/cheesy/browser"

# Pages are written as `route.html` (scripts/flatten-prerender.mjs), with no trailing slash in any
# address (`/es`, `/es/aperturas`, `/es/aperturas/apertura-italiana`): Netlify serves them at `/route`
# and sends `/route/` there, also when a folder `route/` sits next to `route.html`. Pretty URLs (which would also send `/route.html` there) is not set: it is
# a post-processing pass that rewrites the HTML the app hydrates; the canonical URL covers that case.

[build.environment]
  NODE_VERSION = "26.10.0"

# Content files keep their names between deploys: browsers must check them every time they are
# requested, so a new version is never hidden behind a cached one.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://analytics.alvarotc.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://tablebase.lichess.ovh https://analytics.alvarotc.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# One domain: the address Netlify gives the site sends everything to the real one. `force` because
# the files exist on both; deploy previews (`deploy-preview-N--playcheesy.netlify.app`) do not match.
[[redirects]]
  from = "https://playcheesy.netlify.app/*"
  to = "https://cheesy.alvarotc.com/:splat"
  status = 301
  force = true

# The addresses of before the languages (`/openings/italian-game`, `/positions/3`, `/glossary`…),
# each to the same page in English. No file of the build has those paths, so no `force` is needed
# (`pnpm build` checks it).
# BEGIN old addresses (generated by scripts/netlify-redirects.mjs: do not edit)
