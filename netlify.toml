# END old addresses

# The pages people search for are prerendered at build time (`route.html`) and Netlify serves
# an existing file before this rule. The rest (analysis, opening practice and the puzzles of
# "Practise more", in both languages) gets the app shell, which renders in the
# browser: `index.html` is the prerendered home page now, and hydrating it on another route fails.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
