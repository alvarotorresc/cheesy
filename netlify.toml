[build]
  command = "pnpm build"
  publish = "dist/cheesy/browser"

# Pages are written as `route.html` (scripts/flatten-prerender.mjs): Netlify serves them at `/route`
# and sends `/route/` there. Pretty URLs (which would also send `/route.html` there) is not set: it is
# a post-processing pass that rewrites the HTML the app hydrates; the canonical URL covers that case.

[build.environment]
  NODE_VERSION = "26.10.0"

# Content files keep their names between deploys: browsers must check them every time they are
# requested, so a new version is never hidden behind a cached one.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://analytics.alvarotc.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://tablebase.lichess.ovh https://analytics.alvarotc.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"

# The pages people search for are prerendered at build time (`route.html`) and Netlify serves
# an existing file before this rule. The rest (analysis, opening practice, the puzzles of "Practise
# more", old addresses that redirect in the router) gets the app shell, which renders in the
# browser: `index.html` is the prerendered home page now, and hydrating it on another route fails.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
