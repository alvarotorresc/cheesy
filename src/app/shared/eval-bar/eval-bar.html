<div
  class="evalbar"
  role="meter"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="mode() === 'on' ? percent() : null"
  [attr.aria-valuetext]="text() ?? emptyLabel()"
  [attr.aria-label]="label()"
  [class.off]="mode() === 'off'"
  [class.loading]="mode() === 'loading'"
  [class.flipped]="orientation() === 'black'"
  [style.--share]="whiteShare()"
>
  <div class="white"></div>
  <div class="mid"></div>
  @if (text(); as value) {
    <span class="value" [class.on-white]="whiteAhead()" aria-hidden="true">{{ value }}</span>
  }
</div>
