<!-- Chessground fills this element, so the live region has to sit next to it, not inside. -->
<div
  #board
  class="board"
  tabindex="0"
  role="application"
  [attr.aria-roledescription]="labels().roleDescription"
  [attr.aria-label]="viewOnly() ? labels().viewOnlyInstructions : labels().instructions"
  (focus)="onFocus()"
  (keydown)="onKey($event)"
></div>
<p class="visually-hidden" aria-live="polite">
  <!-- Keyed by the announcement, so the same text twice is said twice. -->
  @for (said of [announcement()]; track said.id) {
    {{ said.text }}
  }
</p>

@if (pendingPromotion(); as pending) {
  <div
    class="promotion"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="labels().promotion"
    (keydown.escape)="cancelPromotion()"
  >
    <div class="choices">
      @for (role of promotionRoles; track role) {
        <button
          #promotionButton
          type="button"
          class="choice"
          [class.black]="pending.color === 'black'"
          [attr.aria-label]="labels()[role]"
          [title]="labels()[role]"
          (click)="choosePromotion(role)"
        >
          <span aria-hidden="true">{{ glyphs[role] }}</span>
        </button>
      }
    </div>
    <button type="button" class="cancel" (click)="cancelPromotion()">
      {{ labels().cancel }}
    </button>
  </div>
}
