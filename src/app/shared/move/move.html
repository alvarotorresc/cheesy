<span class="shown" aria-hidden="true">
  @if (parts(); as parts) {
    @for (part of parts; track $index) {
      @if (part.kind === 'piece') {
        <span [class]="'pc icon pc-' + part.code"></span>
      } @else {
        <ng-container>{{ part.text }}</ng-container>
      }
    }
  } @else {
    <ng-container>{{ text() }}</ng-container>
  }
</span>
<span class="visually-hidden">{{ sentence() }}</span>
