<div
  class="board"
  role="img"
  [attr.aria-label]="label()"
  [class.resetting]="resetting()"
  [class.fading]="fading()"
  [class.ring]="ring()"
  [class.rings]="ringsOn()"
>
  @for (hl of highlights(); track $index) {
    <div class="sq hl" [hidden]="hl.hidden" [style.transform]="hl.transform"></div>
  }
  @if (rankTransform(); as transform) {
    <div class="rank-hl on" [style.transform]="transform"></div>
  }
  @for (piece of pieces(); track piece.id) {
    <div
      class="pc"
      [class]="'pc-' + piece.code"
      [class.gone]="piece.gone"
      [style.transform]="piece.transform"
    ></div>
  }
  @for (transform of ringSquares(); track $index) {
    <div class="sq ring" [style.transform]="transform"></div>
  }
  @if (arrowLines().length) {
    <svg class="arrows" viewBox="0 0 8 8" aria-hidden="true">
      <defs>
        <marker
          id="mb-arrow-head"
          viewBox="0 0 4 4"
          refX="2"
          refY="2"
          markerWidth="3"
          markerHeight="3"
          orient="auto"
        >
          <path d="M0,0 L4,2 L0,4 z" />
        </marker>
      </defs>
      @for (l of arrowLines(); track $index) {
        <line
          [attr.x1]="l.x1"
          [attr.y1]="l.y1"
          [attr.x2]="l.x2"
          [attr.y2]="l.y2"
          marker-end="url(#mb-arrow-head)"
        />
      }
    </svg>
  }
</div>
