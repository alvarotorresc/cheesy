<a class="skip-link" href="#main" (click)="skipToContent($event)">{{
  i18n.t().app.skipToContent
}}</a>

<header class="header">
  <div class="header-inner">
    <a class="brand" [routerLink]="links.home()" [attr.aria-label]="i18n.t().app.homeLabel">
      <app-logo class="logo" />
      <span class="wordmark">{{ i18n.t().app.name }}</span>
    </a>

    <nav class="nav" [attr.aria-label]="i18n.t().app.mainNavigation">
      @for (section of sections; track section) {
        <a
          class="nav-link"
          [routerLink]="sectionLink(section)"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          {{ i18n.t().nav[section] }}
        </a>
      }
    </nav>

    <div class="reading" role="group" [attr.aria-label]="i18n.t().app.readingMode">
      @for (mode of readingModes; track mode) {
        <button
          type="button"
          class="lang-button"
          [attr.aria-pressed]="reading.mode() === mode"
          (click)="reading.setMode(mode)"
        >
          {{ i18n.t().app[mode] }}
        </button>
      }
    </div>

    <div class="lang" role="group" [attr.aria-label]="i18n.t().app.language">
      @for (lang of langs; track lang) {
        <a
          class="lang-button"
          [routerLink]="langLink(lang)"
          [attr.lang]="lang"
          [attr.hreflang]="lang"
          [attr.aria-current]="i18n.lang() === lang ? 'true' : null"
          (click)="i18n.rememberLang(lang)"
        >
          {{ lang.toUpperCase() }}
        </a>
      }
    </div>
  </div>
</header>

<main
  #main
  id="main"
  class="main"
  [class.main--play]="mainKind() === 'play'"
  [class.main--home]="mainKind() === 'home'"
  [class.main--about]="mainKind() === 'about'"
  tabindex="-1"
>
  <router-outlet />
</main>

<app-site-footer [class.compact]="mainKind() === 'play'" />

<app-toast />
