<section class="share" aria-labelledby="share-title">
  <h2 id="share-title" class="panel-title">{{ i18n.t().share.title }}</h2>

  <div class="button-row">
    <button type="button" class="button" (click)="copyFen()">{{ i18n.t().share.copyFen }}</button>
    <button type="button" class="button" (click)="copyPgn()">{{ i18n.t().share.copyPgn }}</button>
    <button type="button" class="button" (click)="copyLink()">
      {{ i18n.t().share.copyLink }}
    </button>
  </div>

  <p class="feedback" role="status">{{ message() }}</p>

  @if (attempt(); as current) {
    @if (!current.ok) {
      <label class="visually-hidden" for="share-fallback">{{ i18n.t().share.textToCopy }}</label>
      <textarea
        #fallback
        id="share-fallback"
        class="fallback textarea"
        rows="3"
        readonly
        [value]="current.text"
      ></textarea>
    }
  }
</section>
