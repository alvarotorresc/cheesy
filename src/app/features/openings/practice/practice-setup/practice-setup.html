@let t = i18n.t().practice;

<section class="setup" aria-labelledby="setup-title">
  <h2 id="setup-title" class="panel-title">{{ t.setupTitle }}</h2>
  <p class="intro">{{ t.intro }}</p>

  <fieldset>
    <legend>{{ t.color }}</legend>
    <div class="colors">
      @for (color of colors; track color) {
        <label class="option color">
          <input
            type="radio"
            name="practice-color"
            [value]="color"
            [checked]="session.playerColor() === color"
            (change)="onColorChange(color)"
          />
          {{ color === 'white' ? i18n.t().openings.white : i18n.t().openings.black }}
        </label>
      }
    </div>
  </fieldset>

  <fieldset>
    <legend>{{ t.line }}</legend>
    <p class="count">{{ count() }}</p>
    <ul class="lines">
      <li>
        <label class="option line">
          <input
            type="radio"
            name="practice-line"
            [value]="allLines"
            [checked]="session.selectedLine() === allLines"
            (change)="onLineChange(allLines)"
          />
          <span class="line-text">
            <span class="line-title">{{ t.allLines(options().length) }}</span>
          </span>
        </label>
      </li>
      @for (option of options(); track option.id) {
        <li>
          <label class="option line">
            <input
              type="radio"
              name="practice-line"
              [value]="option.id"
              [checked]="session.selectedLine() === option.id"
              (change)="onLineChange(option.id)"
            />
            <span class="line-text">
              <span class="line-title">
                {{ option.title }}
                @if (option.variation) {
                  <span class="variation">· {{ option.variation }}</span>
                }
              </span>
              <span class="moves">{{ option.moves }}</span>
              <span class="progress" [class.mastered]="option.mastered">{{ option.progress }}</span>
            </span>
          </label>
        </li>
      }
    </ul>
  </fieldset>

  <button type="button" class="button primary start" (click)="session.start()">
    {{ t.start }}
  </button>

  <app-progress-note [hasProgress]="session.hasProgress()" />
</section>
